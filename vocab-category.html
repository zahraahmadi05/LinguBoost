<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguBoost</title>
    <link rel="icon" href="icons/book-logo.png" />
    <link href="./dist/output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="mx-auto w-full max-w-md min-h-dvh bg-white">
      <section class="flex flex-col p-6">
        <header>
          <a href="vocabulary.html">
            <img
              src="icons/arrow-back.svg"
              alt="Back to vocabulary"
              class="w-10 h-10"
            />
          </a>
          <div class="mt-4 flex items-center gap-4">
            <img
              id="category-icon"
              src="icons/programming.png"
              alt=""
              class="w-16 h-16 shrink-0"
            />
            <div class="flex flex-col gap-2">
              <h1 id="category-title" class="text-[#100695] text-3xl">
                Programming
              </h1>
              <span id="word-count" class="text-[#7394EF]">24 Words</span>
            </div>
          </div>
        </header>

        <div
          class="bg-[#DEE5FD] flex rounded-2xl items-center justify-between mt-6 p-4"
        >
          <p id="category-tagline" class="text-[#0F33E6] text-lg">
            Learn the language <br />
            of the future.
          </p>
          <img
            id="text-icon"
            src="icons/laptop.png"
            alt=""
            class="w-20 h-20 shrink-0"
          />
        </div>

        <ul id="word-list" class="mt-6 flex flex-col gap-4">
          <li class="relative rounded-2xl border border-[#81A7F1] bg-white p-4">
            <div data-content class="flex flex-col gap-2 pr-8">
              <div class="flex items-center gap-2">
                <h2 class="text-[#082DC0] text-lg">Variable</h2>
                <span
                  class="rounded-full px-3 py-0.5 text-sm bg-[#CACDFA] text-[#1F82FB]"
                  >noun</span
                >
              </div>
              <p class="text-[#5288D4]">a container for storing data</p>
              <p class="rounded-xl bg-[#DAEDF9] px-3 py-2 text-[#5676F6]">
                “The variable holds the user’s name.”
              </p>
            </div>
            <button
              type="button"
              data-learn="variable"
              aria-pressed="false"
              aria-label="Mark Variable as learned"
              class="absolute top-1 right-1 flex h-11 w-11 cursor-pointer items-center justify-center"
            >
              <span
                class="flex w-8 h-8 items-center justify-center rounded-full border-2 border-[#6EE615]"
              >
                <img src="icons/checked.png" alt="" class="w-6 h-6 hidden" />
              </span>
            </button>
          </li>

          <li class="relative rounded-2xl border border-[#81A7F1] bg-white p-4">
            <div data-content class="flex flex-col gap-2 pr-8 opacity-50">
              <div class="flex items-center gap-2">
                <h2 class="text-[#082DC0] text-lg">Variable</h2>
                <span
                  class="rounded-full px-3 py-0.5 text-sm bg-[#CACDFA] text-[#1F82FB]"
                  >noun</span
                >
              </div>
              <p class="text-[#5288D4]">a container for storing data</p>
              <p class="rounded-xl bg-[#DAEDF9] px-3 py-2 text-[#5676F6]">
                “The variable holds the user’s name.”
              </p>
            </div>
            <button
              type="button"
              data-learn="variable"
              aria-pressed="true"
              aria-label="Mark Variable as learned"
              class="absolute top-1 right-1 flex h-11 w-11 cursor-pointer items-center justify-center"
            >
              <span
                class="flex w-8 h-8 items-center justify-center rounded-full border-2 border-[#7EDC8B]"
              >
                <img src="icons/checked.png" alt="" class="w-6 h-6" />
              </span>
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="js/vocab.js"></script>
    <script src="js/vocab-category.js"></script>
  </body>
</html>
