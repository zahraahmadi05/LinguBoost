<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguBoost</title>
    <link rel="icon" href="icons/books-sprout-illustration.svg" />
    <link href="./dist/output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="mx-auto w-full max-w-md min-h-dvh bg-white">
      <section class="min-h-dvh flex flex-col p-6">
        <div class="flex-1 flex flex-col items-center justify-evenly gap-4">
          <img src="icons/logo-leaf.svg" alt="" class="w-20 h-20" />
          <h1 class="text-blue-950 text-4xl font-bold">LinguBoost</h1>
          <span class="text-blue-600 text-2xl text-center">
            Small steps.<br />
            Big progress.
          </span>
          <img
            src="icons/books-sprout-illustration.svg"
            alt=""
            class="w-40 h-40"
          />
          <p class="text-blue-800 text-2xl">Welcome Dear User</p>

          <form class="w-full flex flex-col gap-3">
            <label for="name" class="text-2xl text-blue-800">Full Name</label>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Enter your pretty name"
              class="w-full bg-purple-100 rounded-2xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
            />
          </form>
        </div>

        <a
          id="done-btn"
          href="home.html"
          class="mt-6 block w-full text-center bg-blue-700 text-2xl text-white py-3 rounded-4xl"
        >
          Done ✅
        </a>
      </section>
    </main>
    <script src="welcome.js"></script>
  </body>
</html>
