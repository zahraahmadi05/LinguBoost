<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguBoost</title>
    <link rel="icon" href="icons/books-sprout-illustration.svg" />
    <link href="./dist/output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="mx-auto w-full max-w-md min-h-dvh bg-white">
      <section class="min-h-dvh flex flex-col p-6 pb-20">
        <header class="flex flex-col">
          <a href="home.html">
            <img
              id="back-btn"
              src="icons/back-arrow.png"
              alt=""
              class="w-9 h-9 rounded-full mb-4"
            />
          </a>
          <h1 class="text-[#28053E] text-2xl">Profile</h1>
          <span class="text-[#918098] text-base"
            >Your learning journey, your way🌱</span
          >
          <div class="flex items-center gap-2 mt-4">
            <div
              class="flex items-center justify-center shrink-0 w-24 h-24 rounded-full"
            >
              <img
                src="icons/sprout.png"
                alt=""
                class="w-24 h-24 rounded-full"
              />
            </div>
            <div class="flex flex-col">
              <span id="profile-name" class="text-[#29075F] text-2xl"
                >Friend</span
              >
              <p class="text-[#A199A6] text-lg flex items-center gap-1">
                Keep going
                <img src="icons/sun.svg" alt="" class="w-6 h-6 rounded-full" />
              </p>
            </div>
          </div>
        </header>

        <div class="border border-[#A1DA94] mt-6 rounded-2xl p-4">
          <div class="flex items-center gap-3">
            <img
              src="icons/level.png"
              alt=""
              class="w-12 h-12 shrink-0 bg-blue-200 rounded-full"
            />
            <div class="flex flex-col">
              <span class="text-[#040D61] text-xl">Your Level</span>
              <p class="text-[#A39FA7] text-sm">Select your current level</p>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2 mt-4">
            <button
              type="button"
              data-level="beginner"
              class="relative flex flex-col items-center gap-1 p-1 py-4 cursor-pointer bg-[#DEF0DC] border border-[#4BDE43] rounded-2xl"
            >
              <img src="icons/sprout.svg" alt="" class="w-8 h-8" />
              <span class="text-[#070247] text-base mt-1">Beginner</span>
              <p class="text-[#A79F9F] text-xs">Just Starting</p>
              <img
                data-check
                src="icons/check.png"
                alt=""
                class="hidden absolute top-2 right-2 w-7 h-7 rounded-full"
              />
            </button>
            <button
              type="button"
              data-level="intermediate"
              class="relative flex flex-col items-center gap-1 px-1 py-4 cursor-pointer bg-[#D9D9F8] border border-[#6442EC] rounded-2xl"
            >
              <img src="icons/level-intermediate.png" alt="" class="w-8 h-8" />
              <span class="text-[#070247] text-base mt-1">Intermediate</span>
              <p class="text-[#A79F9F] text-xs">Building skills</p>
              <img
                data-check
                src="icons/check.png"
                alt=""
                class="hidden absolute top-2 right-2 w-7 h-7 rounded-full"
              />
            </button>
            <button
              type="button"
              data-level="advanced"
              class="relative flex flex-col items-center gap-1 px-1 py-4 cursor-pointer bg-[#ECD2F9] border border-[#B475C6] rounded-2xl"
            >
              <img src="icons/level-advanced.png" alt="" class="w-8 h-8" />
              <span class="text-[#070247] text-base mt-1">Advanced</span>
              <p class="text-[#A79F9F] text-xs">Beyond basics</p>
              <img
                data-check
                src="icons/check.png"
                alt=""
                class="hidden absolute top-2 right-2 w-7 h-7 rounded-full"
              />
            </button>
          </div>
        </div>

        <div class="bg-[#FFFFFF] border border-[#65CDEF] mt-6 rounded-2xl p-6">
          <div class="flex items-center gap-3">
            <div
              class="bg-[#C8D5FA] rounded-full w-12 h-12 flex items-center justify-center shrink-0"
            >
              <img src="icons/calendar.svg" alt="" class="w-7 h-7" />
            </div>
            <div class="flex flex-col">
              <span class="text-[#1E0367] text-xl">Join Date</span>
              <p class="text-[#A687AC] text-base">You joined LinguBoost on</p>
            </div>
          </div>
          <div
            class="bg-[#CCF3F9] w-full h-12 rounded-full mt-6 flex items-center px-5 gap-4"
          >
            <img src="icons/calendar.svg" alt="" class="w-7 h-7 shrink-0" />
            <span id="join-date" class="text-lg text-[#210480]"></span>
            <img src="icons/lock.svg" alt="" class="w-7 h-7 shrink-0 ml-auto" />
          </div>
        </div>

        <div class="bg-[#ffffff] border border-[#D585F5] mt-6 rounded-2xl p-6">
          <div class="flex items-center gap-3">
            <div
              class="rounded-full w-12 h-12 flex items-center justify-center shrink-0"
            >
              <img
                src="icons/profile.png"
                alt=""
                class="w-11 h-11 rounded-full"
              />
            </div>
            <div class="flex flex-col">
              <span class="text-[#170398] text-xl">Your Name</span>
              <p class="text-[#A687AC] text-base">This is how you see</p>
            </div>
          </div>
          <button
            type="button"
            id="edit-name"
            class="bg-[#CCF3F9] w-full h-14 cursor-pointer rounded-xl mt-6 flex items-center px-5 text-left"
          >
            <span id="name-value" class="text-[#0D0986] text-lg">Friend</span>
            <img
              src="icons/chevron-right-profile.svg"
              alt=""
              class="w-6 h-6 shrink-0 ml-auto"
            />
          </button>
        </div>

        <nav
          class="fixed bottom-0 left-1/2 w-full max-w-md -translate-x-1/2 border-t border-gray-300 bg-white"
        >
          <div class="flex justify-around py-2">
            <a href="home.html" class="flex flex-col items-center">
              <img src="icons/home.png" alt="" class="w-10 h-10 rounded-full" />
              <p class="text-[#1D0555] text-sm font-medium">Home</p>
            </a>
            <a href="practice.html" class="flex flex-col items-center">
              <img
                src="icons/practice.png"
                alt=""
                class="w-10 h-10 rounded-full"
              />
              <p class="text-[#1D0555] text-sm font-medium">Practice</p>
            </a>
            <a href="progress.html" class="flex flex-col items-center">
              <img
                src="icons/progres.png"
                alt=""
                class="w-10 h-10 rounded-full"
              />
              <p class="text-[#1D0555] text-sm font-medium">Progress</p>
            </a>
            <a href="more.html" class="flex flex-col items-center">
              <img
                src="icons/more-menu.png"
                alt=""
                class="w-10 h-10 rounded-full"
              />
              <p class="text-[#1D0555] text-sm font-medium">More</p>
            </a>
          </div>
        </nav>

        <div id="name-sheet" class="hidden fixed inset-0 z-50 bg-black/40">
          <form
            id="name-form"
            class="absolute bottom-0 left-1/2 w-full max-w-md -translate-x-1/2 rounded-t-2xl bg-white p-4"
          >
            <div class="flex items-center justify-between">
              <label for="name-input" class="text-base text-[#0C317B]"
                >Change your name</label
              >
              <button type="button" id="close-sheet" aria-label="Close">
                <img
                  src="icons/close.svg"
                  alt=""
                  class="w-6 h-6 cursor-pointer"
                />
              </button>
            </div>

            <input
              id="name-input"
              type="text"
              placeholder="Change your pretty name"
              minlength="4"
              maxlength="20"
              autocomplete="off"
              class="mt-4 w-full rounded-xl border border-[#68D8D6] px-4 py-3 text-lg text-[#0D0986] focus:outline-none focus:ring-2 focus:ring-[#5D4CF4]"
            />

            <button
              type="submit"
              class="mt-3 bg-[#5D4CF4] w-full rounded-full py-3 text-lg text-white font-medium cursor-pointer"
            >
              Save
            </button>
          </form>
        </div>
      </section>
    </main>
    <script src="js/user-profile.js"></script>
  </body>
</html>
