<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguBoost</title>
    <link rel="icon" href="icons/books-sprout-illustration.svg" />
    <link href="./dist/output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="mx-auto w-full max-w-md min-h-dvh bg-white">
      <section class="min-h-dvh flex flex-col p-6">
        <header class="flex items-center justify-between">
          <div class="flex flex-col">
            <p class="text-purple-500 text-lg">Hi Dear,</p>
            <div class="flex items-center gap-1">
              <span id="user-name" class="text-blue-950 text-xl">Zara</span>
              <img src="icons/sun.svg" alt="sun-logo" class="w-8 h-8" />
            </div>
          </div>
          <div class="w-10 h-10 bg-blue-200 rounded-full">
            <img src="icons/user.svg" alt="user-profile" />
          </div>
        </header>

        <div class="bg-[#C7D4FD] mt-4 flex p-5 rounded-2xl">
          <div class="flex-1">
            <p class="text-[#1E0B7F]">
              A new day, <br />
              A new word.
            </p>
            <p class="text-[#4D486C]">
              Keep going -- you're <br />
              building something great!
            </p>
          </div>
          <div class="flex flex-col items-end justify-between shrink-0">
            <img src="icons/sprout.svg" alt="sprout-logo" class="w-10 h-10" />
            <a id="daily-btn" href="daily-word.html" class="">
              <img
                src="icons/arrow-circle.svg"
                alt="arrow-circle-logo"
                class="w-10 h-10"
              />
            </a>
          </div>
        </div>
      </section>
    </main>
    <script src="home.js"></script>
  </body>
</html>
