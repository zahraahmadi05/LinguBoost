<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguBoost</title>
    <link rel="icon" href="icons/book-logo.png" />
    <link href="./dist/output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="mx-auto w-full max-w-md min-h-dvh bg-white">
      <section class="min-h-dvh flex flex-col p-6 pb-22">
        <header>
          <a href="home.html" class="inline-block">
            <img
              src="icons/arrow-back.png"
              alt="Back to home"
              class="w-10 h-10"
            />
          </a>
          <div class="mt-4 flex items-center gap-4">
            <img src="icons/vocabulary.png" alt="" class="w-18 h-18 shrink-0" />
            <div>
              <h1 class="text-3xl text-[#051070]">Vocabulary</h1>
              <p class="text-lg text-[#498AC8]">Build your word bank</p>
            </div>
          </div>
        </header>

        <div class="flex bg-[#DEE5FD] rounded-2xl mt-6 items-center gap-4 p-4">
          <img
            src="icons/book-logo.png"
            alt="logo"
            class="w-24 h-24 shrink-0 object-contain"
          />
          <div class="flex flex-col gap-2">
            <p class="text-[#2B48D6] text-base">
              Small words. <br />
              Big opportunities.
            </p>
            <p class="text-[#8A6C9D] text-sm">
              Expand your vocabulary, <br />
              Expand your world.
            </p>
          </div>
        </div>

        <h1 class="mt-4 text-xl text-[#010834]">Categories</h1>

        <div id="category-grid" class="mt-4 grid grid-cols-3 gap-3"></div>

        <nav
          class="fixed bottom-0 left-1/2 w-full max-w-md -translate-x-1/2 border-t border-gray-300 bg-white"
        >
          <div class="flex justify-around py-2">
            <a href="home.html" class="flex flex-col items-center">
              <img src="icons/home.svg" alt="" class="w-10 h-10 rounded-full" />
              <p class="text-[#601de8] text-sm font-medium">Home</p>
            </a>
            <a href="practice.html" class="flex flex-col items-center">
              <img
                src="icons/practice.svg"
                alt=""
                class="w-10 h-10 rounded-full"
              />
              <p class="text-[#601de8] text-sm font-medium">Practice</p>
            </a>
            <a href="progress.html" class="flex flex-col items-center">
              <img
                src="icons/progress.svg"
                alt=""
                class="w-10 h-10 rounded-full"
              />
              <p class="text-[#601de8] text-sm font-medium">Progress</p>
            </a>
            <a href="more.html" class="flex flex-col items-center">
              <img src="icons/more.svg" alt="" class="w-10 h-10 rounded-full" />
              <p class="text-[#601de8] text-sm font-medium">More</p>
            </a>
          </div>
        </nav>
      </section>
    </main>
    <script src="js/vocab.js"></script>
    <script src="js/vocabulary.js"></script>
  </body>
</html>
